# Builds the Docker image on every push to main and deploys it to the Hostinger VPS.
# Needs repository secrets VPS_HOST and VPS_SSH_KEY (see deploy/HOSTINGER.md).
name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      # Until the VPS is set up (deploy/HOSTINGER.md), the image is still built but nothing is deployed.
      HAS_VPS: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: VPS not set up yet
        if: env.HAS_VPS != 'true'
        run: echo "::notice::Skipping deploy. Add the VPS_HOST and VPS_SSH_KEY secrets (deploy/HOSTINGER.md)."
      - uses: actions/checkout@v4
        if: env.HAS_VPS == 'true'
      - name: Copy the compose file and deploy script
        if: env.HAS_VPS == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/up.sh
          target: /opt/rankflow
          strip_components: 1
      - name: Pull and restart
        if: env.HAS_VPS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            IMAGE="${{ env.IMAGE }}:${{ github.sha }}" sh /opt/rankflow/up.sh
            docker logout ghcr.io
