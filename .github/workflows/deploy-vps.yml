# Builds the Docker image on every push to main and deploys it to the Hostinger VPS.
# Needs repository secrets VPS_HOST and VPS_SSH_KEY (see deploy/HOSTINGER.md).
name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      # Until the VPS is set up (deploy/HOSTINGER.md), the image is still built but nothing is deployed.
      HAS_VPS: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: VPS not set up yet
        if: env.HAS_VPS != 'true'
        run: echo "::notice::Skipping deploy. Add the VPS_HOST and VPS_SSH_KEY secrets (deploy/HOSTINGER.md)."
      - uses: actions/checkout@v4
        if: env.HAS_VPS == 'true'
      # VPS_SSH_KEY may be the key file as-is, the key with its line breaks lost (copied from a
      # browser terminal), or one line from `base64 -w0 /root/.ssh/github_deploy`. Rebuild it.
      - name: Prepare the SSH key
        if: env.HAS_VPS == 'true'
        env:
          RAW_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          k="$RAW_KEY"
          if ! printf '%s' "$k" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            k=$(printf '%s' "$k" | tr -d ' \r\n\t' | base64 -d 2>/dev/null || true)
          fi
          body=$(printf '%s' "$k" | sed 's/-----BEGIN OPENSSH PRIVATE KEY-----//; s/-----END OPENSSH PRIVATE KEY-----//' | tr -d ' \r\n\t')
          { echo '-----BEGIN OPENSSH PRIVATE KEY-----'; printf '%s' "$body" | fold -w70; echo; echo '-----END OPENSSH PRIVATE KEY-----'; } > .deploy_key
          chmod 600 .deploy_key
          ssh-keygen -y -f .deploy_key >/dev/null || { echo "::error::The VPS_SSH_KEY secret is not a valid private key. Set it again (deploy/HOSTINGER.md step 2)."; exit 1; }
      - name: Copy the compose file and deploy script
        if: env.HAS_VPS == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key_path: .deploy_key
          source: deploy/docker-compose.yml,deploy/up.sh
          target: /opt/rankflow
          strip_components: 1
      - name: Pull and restart
        if: env.HAS_VPS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key_path: .deploy_key
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            IMAGE="${{ env.IMAGE }}:${{ github.sha }}" sh /opt/rankflow/up.sh
            docker logout ghcr.io
